<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    <p class="site-footer__links">
      <a href="mailto:{{ site.links.email }}">Email</a>
      <a href="https://github.com/{{ site.links.github }}">GitHub</a>
      <a href="https://orcid.org/{{ site.links.orcid }}">ORCID</a>
      <a href="https://www.linkedin.com/in/{{ site.links.linkedin }}">LinkedIn</a>
      <a href="https://scholar.google.com/citations?user={{ site.links.scholar }}">Google Scholar</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
