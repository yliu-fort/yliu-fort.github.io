# Site settings
title: Yuxuan Liu
description: >-
  Notes and papers by Yuxuan Liu on ocean waves, numerical methods
  and machine learning.
url: "https://yliu-fort.github.io"
baseurl: ""
lang: en
timezone: Europe/London

author:
  name: Yuxuan Liu

# Profile links (sidebar, footer, structured data)
links:
  email: liuyx430@gmail.com
  github: yliu-fort
  orcid: 0000-0002-4880-2374
  linkedin: liu-yuxuan-19566184
  scholar: d9K4mpUAAAAJ

social:
  name: Yuxuan Liu
  links:
    - https://orcid.org/0000-0002-4880-2374
    - https://github.com/yliu-fort
    - https://www.linkedin.com/in/liu-yuxuan-19566184
    - https://scholar.google.com/citations?user=d9K4mpUAAAAJ

# Blog
permalink: /blog/:year/:title/
home_posts: 6            # posts listed on the home page

# Markdown. GitHub Pages forces GFM input, MathJax math and Rouge highlighting;
# they are spelled out here so local builds behave the same way.
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  hard_wrap: false
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      mathjax: true
      toc: false
      cite: true
  - scope:
      path: "_drafts"
    values:
      layout: post
      mathjax: true
      toc: false
      cite: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page

include:
  - _pages

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - resume/
  - vendor/
  - .DS_Store

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
